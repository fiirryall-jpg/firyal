<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kalkulator</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #5f5454;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .calculator {
        background-color: #ffc0c0;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    button {
        width: 50px;
        height: 50px;
        margin: 5px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        background-color: #4964fd;
        color: white;
        cursor: pointer;
    }
    .clear {
        background-color: #a62626;
        color: white;
    }
    .special {
        background-color: #373a46;
        color: white;
    }
    input[type="text"] {
        width: 220px;
        height: 40px;
        margin-bottom: 10px;
        text-align: right;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    </style>

<body>
    <div class="calculator">
        <button onclick="clearlayar()" class="clear">C</button>
        <button class="special" onclick="backspace()">⌫</button>
        <input type="text" id="layar" disabled>
        <br>
        <button onclick="tambahangka('7')">7</button>
        <button onclick="tambahangka('8')">8</button>       
        <button onclick="tambahangka('9')">9</button>
        <button onclick="tambahangka('/')">/</button>
        <br>
        <button onclick="tambahangka('4')">4</button>   
        <button onclick="tambahangka('5')">5</button>
        <button onclick="tambahangka('6')">6</button>
        <button onclick="tambahangka('*')">*</button>
        <br>
        <button onclick="tambahangka('1')">1</button>
        <button onclick="tambahangka('2')">2</button>
        <button onclick="tambahangka('3')">3</button>
        <button onclick="tambahangka('-') "->-</button>
        <br>
        <button onclick="tambahangka('0')">0</button>
        <button onclick="tambahangka('.')">.</button>
        <button onclick="hitung()">=</button>
        <button onclick="tambahangka('+')">+</button>
        <br>
        
        <script>
            function tambahangka(angka) {
                document.getElementById('layar').value += angka;
            }
            function clearlayar() {
                document.getElementById('layar').value = '';
            }
            function hitung() {
                var expression = document.getElementById('layar').value;
                var result = eval(expression);
                document.getElementById('layar').value = result;
            }
            function backspace() {
                var layar = document.getElementById('layar');
                layar.value = layar.value.slice(0, -1);
            }
    </script>
</body>
</html>
